version: '3.8'
services:
  litellm:
    image: ghcr.io/berriai/litellm:main
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/litellm_config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=1
    command: ["--config", "/litellm_config.yaml"]
