services:
  litellm:
    image: ghcr.io/berriai/litellm:main
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/litellm_config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=1
    command: ["--config", "/litellm_config.yaml"]

  oracle-bot:
    build:
      context: ./04_SOFTWARE/discord/p31-bot
    container_name: oracle-bot
    restart: unless-stopped
    ports:
      - "3005:3000"
    env_file:
      - ./04_SOFTWARE/discord/p31-bot/.env
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
