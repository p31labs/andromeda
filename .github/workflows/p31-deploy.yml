name: p31-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: p31-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.32.1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:lint

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: software/p31ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  audit-content:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: software/p31ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:content

  audit-pages:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: software/p31ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:pages

  ground-truth:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: software/p31ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:ground-truth
      - run: pnpm run verify:worker-spa-launch

  hub-verify:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: software/p31ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run hub:verify

  security:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: software/p31ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:audit
      - run: pnpm run security:workers
      - run: pnpm run security:crypto

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, audit-content, audit-pages, ground-truth, hub-verify, security]
    defaults:
      run:
        working-directory: software/p31ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '${{ env.PNPM_VERSION }}'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: p31ca-staging
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    runs-on: ubuntu-latest
    needs: staging
    steps:
      - name: Staging health check
        run: |
          curl --fail --retry 3 --retry-delay 5 https://staging.p31ca.org || exit 1
          curl --fail --retry 3 --retry-delay 5 https://staging.p31ca.org/andromeda || exit 1
      - name: Verify critical assets
        run: |
          curl --fail https://staging.p31ca.org/robots.txt
          curl --fail https://staging.p31ca.org/.well-known/security.txt

  quality-gate:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, audit-content, audit-pages, ground-truth, hub-verify, security, build, staging, smoke]
    if: always()
    steps:
      - name: Evaluate all dependencies
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "typecheck:   ${{ needs.typecheck.result }}"
          echo "audit-content: ${{ needs.audit-content.result }}"
          echo "audit-pages:  ${{ needs.audit-pages.result }}"
          echo "ground-truth:  ${{ needs.ground-truth.result }}"
          echo "hub-verify:  ${{ needs.hub-verify.result }}"
          echo "security:    ${{ needs.security.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "staging:     ${{ needs.staging.result }}"
          echo "smoke:       ${{ needs.smoke.result }}"
      - name: Block on failure
        if: |
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.audit-content.result != 'success' ||
          needs.audit-pages.result != 'success' ||
          needs.ground-truth.result != 'success' ||
          needs.hub-verify.result != 'success' ||
          needs.security.result != 'success' ||
          needs.build.result != 'success' ||
          needs.staging.result != 'success' ||
          needs.smoke.result != 'success'
        run: |
          echo "::error::Quality gate failed — at least one stage did not pass."
          exit 1
      - name: Quality gate passed
        if: success()
        run: echo "All 10 stages passed. Proceeding to production."

  deploy:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: p31ca
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
