name: Omnibus frontend

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "software/frontend/**"
      - "software/p31-forge/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain-constants

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'software/pnpm-lock.yaml'

      - name: Install workspace dependencies (pnpm)
        run: pnpm install --frozen-lockfile --dir software

      - name: Install p31-forge (npm fallback)
        run: cd software/p31-forge && npm install

      - name: Build frontend (Bypassing tsc)
        run: pnpm -C software/frontend exec vite build

      - name: update-dois.js (empty map, exit 0)
        run: cd software && node ops/update-dois.js
