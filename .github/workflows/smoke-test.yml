name: Smoke Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy — K4 Core + Cron"]
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run smoke tests
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        env:
          K4_API: https://k4-cage.trimtab-signal.workers.dev
          PASSPORT_API: https://passport-api.trimtab-signal.workers.dev
          LOVE_API: https://love-ledger.trimtab-signal.workers.dev
          GOVERNANCE_API: https://governance-engine.trimtab-signal.workers.dev

      - name: Run E2E tests (if smoke passes)
        run: |
          chmod +x ./scripts/e2e-onboarding.sh
          chmod +x ./scripts/e2e-governance.sh
          chmod +x ./scripts/e2e-dispute.sh
          ./scripts/e2e-onboarding.sh
          ./scripts/e2e-governance.sh
          ./scripts/e2e-dispute.sh
        env:
          K4_API: https://k4-cage.trimtab-signal.workers.dev
          PASSPORT_API: https://passport-api.trimtab-signal.workers.dev
          LOVE_API: https://love-ledger.trimtab-signal.workers.dev
