name: Fortune 1 — Full Test Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  unit-integration:
    name: Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit:ci
      - uses: codecov/codecov-action@v4
        with: { token: '${{ secrets.CODECOV_TOKEN }}', files: ./coverage/lcov.info, flags: unit }

  e2e-visual-a11y:
    name: E2E + Visual + A11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@4bfc4b0612d25d11a6d78f74c6e7f1ed1ad3d46f
        if: always()
        with: { name: playwright-report, path: playwright-report/ }

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lighthouse:ci
      - uses: actions/upload-artifact@4bfc4b0612d25d11a6d78f74c6e7f1ed1ad3d46f
        if: always()
        with: { name: lighthouse-report, path: .lighthouseci/ }

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with: { scan-type: 'fs', scan-ref: '.', format: 'sarif', output: 'trivy-results.sarif' }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: 'trivy-results.sarif' }
