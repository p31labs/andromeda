# CWP-P31-MAP-2026-01 (D-MAP-14) — tests + static surface checks, no live Stripe
name: donate-api (MAP pipeline)

on:
  push:
    branches: [main, develop]
    paths:
      - "software/donate-api/**"
      - "phosphorus31.org/planetary-planet/src/pages/donate.astro"
      - "scripts/verify-monetary-surface.mjs"
      - ".github/actions/**"
      - ".github/workflows/donate-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "software/donate-api/**"
      - "phosphorus31.org/planetary-planet/src/pages/donate.astro"
      - "scripts/verify-monetary-surface.mjs"
      - ".github/actions/**"
      - ".github/workflows/donate-api.yml"

concurrency:
  group: donate-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain-constants

      - uses: pnpm/action-setup@v4
        with: { version: '10.32.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - name: Install
        working-directory: software/donate-api
        run: pnpm install

      - name: Test (vitest)
        working-directory: software/donate-api
        run: pnpm test

      - name: MAP static verify (from repo root)
        run: node scripts/verify-monetary-surface.mjs
        continue-on-error: true
