name = "phos"
main = "workers/phos-api/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Workers
[[services]]
binding = "PHOS_ATMOSPHERE"
service = "phos-atmosphere"

# KV Namespaces
[[kv_namespaces]]
binding = "PHOS_STATE"
id = "4ba5783f48f54caaa226c94a7f1c2c5f"
preview_id = "4ba5783f48f54caaa226c94a7f1c2c5f"

[[kv_namespaces]]
binding = "PHOS_CACHE"
id = "5530628220d74314bad9867ccd8fece4"
preview_id = "5530628220d74314bad9867ccd8fece4"

# D1 Database
[[d1_databases]]
binding = "PHOS_EVENT_LOG"
database_name = "phos-event-log"
database_id = "1554838e-6f6e-48fa-80cf-1ab1f2fab549"

# Durable Objects
[durable_objects]
bindings = [
  { name = "WS_HUB", class_name = "WebSocketHub" }
]

# Durable Objects migrations (required for DO creation)
[[migrations]]
tag = "v1"
new_classes = [ "WebSocketHub" ]

# Secrets (set via `npx wrangler secret put`)
# DISCORD_WEBHOOK_URL
# HARDWARE_SECRET

[env.production]
routes = ["phos.p31labs.com/*"]

[env.preview]
routes = ["phos.preview.p31labs.com/*"]
