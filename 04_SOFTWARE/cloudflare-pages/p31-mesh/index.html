<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#050510" />
    <title>P31 Family Mesh | P31 Labs</title>
    <meta name="description" content="K4 Family Mesh — real-time co-presence, autonomic regulation, and inter-relational care flows. P31 Labs cognitive prosthetic interface." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="./mesh-overrides.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
  </head>
  <body class="mesh-body">
    <div class="mesh-bg" aria-hidden="true"></div>
    <div class="mesh-canvas-wrap" id="meshCanvasWrap">
      <canvas id="meshCanvas"></canvas>
    </div>

    <div class="mesh-hud" id="meshHud">
      <nav class="mesh-nav mesh-layer-10" id="meshNav">
        <div class="mesh-nav-inner">
          <a href="https://p31ca.org/" class="mesh-nav-brand">
            <span class="mesh-brand-mark" aria-hidden="true"></span>
            <span class="mesh-nav-brand-label">P31 Labs</span>
          </a>
          <div class="mesh-nav-links">
            <a href="https://p31ca.org/index.html" class="mesh-nav-link">← Hub</a>
            <a href="https://github.com/p31labs" class="mesh-nav-link" target="_blank" rel="noopener noreferrer">GitHub</a>
          </div>
        </div>
      </nav>

      <div class="mesh-hud-top-left glass-thin mesh-layer-20" id="meshStatusCard">
        <div class="mesh-status-row">
          <div class="mesh-dot" id="meshStatusDot"></div>
          <span class="mesh-status-text" id="meshStatusText">Initializing...</span>
        </div>
        <div class="mesh-label" style="margin-top:10px">Your node</div>
        <div class="mesh-id-display" id="meshMyId">...</div>
        <div class="mesh-peer-count" id="meshPeerCount"></div>
      </div>

      <div class="mesh-hud-left glass-thin mesh-layer-20" id="meshNodePanel">
        <div class="mesh-panel-title">Family nodes</div>
        <div class="mesh-node-list" id="meshNodeList"></div>
      </div>

      <div class="mesh-hud-right glass-thin mesh-layer-20" id="meshControlPanel">
        <div class="mesh-panel-title">Controls</div>
        <div class="mesh-label">Join room</div>
        <input type="text" id="meshRoomInput" class="mesh-input" placeholder="Room code" autocomplete="off" spellcheck="false" />
        <button type="button" class="mesh-btn mesh-btn-primary" id="meshBtnJoin" disabled>JOIN</button>

        <div class="mesh-label" style="margin-top:14px">Connect to peer</div>
        <input type="text" id="meshPeerInput" class="mesh-input" placeholder="Paste peer ID" autocomplete="off" spellcheck="false" />
        <button type="button" class="mesh-btn mesh-btn-primary" id="meshBtnConnect" disabled>LINK</button>

        <div id="meshSpectateCard" style="display:none;margin-top:14px">
          <div class="mesh-label">Cooperative spectate</div>
          <button type="button" class="mesh-btn mesh-btn-love" id="meshBtnSpectate" disabled>SPECTATE SIBLING</button>
          <button type="button" class="mesh-btn mesh-btn-close-spectate" id="meshBtnCloseSpectate" style="display:none;margin-top:6px" onclick="meshCloseSpectate()">✕ CLOSE</button>
        </div>

        <div id="meshBreathCard" style="display:none;margin-top:14px">
          <div class="mesh-label" style="text-align:center">Vagal sync — 4-4-6</div>
          <div class="mesh-breath-ring" id="meshBreathRing">
            <div class="mesh-breath-label" id="meshBreathLabel">READY</div>
            <div class="mesh-breath-timer" id="meshBreathTimer">—</div>
          </div>
          <button type="button" class="mesh-btn mesh-btn-vagal" id="meshBtnBreath" onclick="meshToggleBreath()">START SYNC</button>
        </div>

        <div class="mesh-sim-section" id="meshSimSection">
          <div class="mesh-label" style="margin-top:14px">Simulation</div>
          <button type="button" class="mesh-btn mesh-btn-sim" onclick="meshSimConnect()">⚡ Sim Connect</button>
          <button type="button" class="mesh-btn mesh-btn-sim" style="margin-top:6px" onclick="meshSimCareFlow()">💜 Sim CareFlow</button>
          <button type="button" class="mesh-btn mesh-btn-sim" style="margin-top:6px" onclick="meshSimSiblingPlaying()">🎮 Sim Sibling Playing</button>
        </div>
      </div>

      <div class="mesh-hud-bottom glass-thin mesh-layer-20" id="meshLogPanel">
        <div class="mesh-panel-title">Mesh log</div>
        <div class="mesh-log" id="meshLog"></div>
      </div>

      <div class="mesh-spoon-tracker glass-thin mesh-layer-20" id="meshSpoonTracker">
        <div class="mesh-spoon-label">Spoons</div>
        <div class="mesh-spoon-bars" id="meshSpoonBars"></div>
        <div class="mesh-spoon-zone" id="meshSpoonZone">—</div>
      </div>
    </div>

    <iframe class="mesh-spectate-frame mesh-layer-50" id="meshSpectateFrame" sandbox="allow-scripts allow-forms" tabindex="-1" aria-hidden="true"></iframe>

    <div class="mesh-noc mesh-layer-60" id="meshNoc" style="display:none"></div>

    <p class="mesh-footer-callout mesh-layer-20">
      <strong>P31 Labs, Inc.</strong> — K4 Family Mesh. Cognitive prosthetic interface. Not medical advice. <a href="https://p31ca.org/">p31ca.org</a>
    </p>

    <script type="module" src="./mesh-app.js"></script>
    <script defer src="./mesh-boot.js"></script>
  </body>
</html>
