name: P31 Delta Topology
version: 2
models:
  - name: PHOS Local (Qwen 7B)
    provider: openai
    model: local-coder
    apiBase: http://localhost:4000
    apiKey: sk-local
    roles: [chat, edit]
  - name: Jump Up (GPT-4o)
    provider: openai
    model: openrouter-openai
    apiBase: http://localhost:4000
    apiKey: sk-local
    roles: [chat]
  - name: Local Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b-instruct-q4_K_M
    apiBase: http://localhost:11434
    roles: [autocomplete]

rules:
  - When filepath contains "firmware" or extension is ".c", ".h", use Local Autocomplete
  - When filepath contains "frontend" or extension is ".tsx", ".jsx", ".ts", ".js", use PHOS Local (Qwen 7B)
  - Always use Local Autocomplete for code generation to preserve privacy

contextProviders:
  - name: google
  - name: diff
  - name: terminal
  - name: problems
