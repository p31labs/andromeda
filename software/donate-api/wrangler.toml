# Deploy name → default URL https://donate-api.<account>.workers.dev (this account: donate-api.trimtab-signal.workers.dev).
# Custom domain: donate-api.phosphorus31.org (route donate-api.phosphorus31.org/*). See DEPLOY.md.
name = "donate-api"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

[vars]
ALLOWED_ORIGIN = "https://phosphorus31.org"
SUCCESS_URL = "https://phosphorus31.org/donate?success=1"
CANCEL_URL = "https://phosphorus31.org/donate"
PAYPAL_MODE = "sandbox"  # "live" for production

# PayPal REST API credentials (set via wrangler CLI):
#   npx wrangler secret put PAYPAL_CLIENT_ID    → from PayPal Developer Dashboard
#   npx wrangler secret put PAYPAL_CLIENT_SECRET → from PayPal Developer Dashboard
#   npx wrangler secret put PAYPAL_WEBHOOK_ID   → from PayPal Developer Dashboard (webhooks)
#   npx wrangler secret put PAYPAL_PRODUCT_ID   → from PayPal Developer Dashboard (billing product)
#   npx wrangler secret put TURNSTILE_SECRET    → from Cloudflare Dashboard
#
# PayPal webhook endpoint: https://donate-api.phosphorus31.org/paypal-webhook
# Events to subscribe: CHECKOUT.ORDER.APPROVED, PAYMENT.CAPTURE.COMPLETED, BILLING.SUBSCRIPTION.ACTIVATED, PAYMENT.SALE.COMPLETED
#
# Cloudflare Turnstile: https://dash.cloudflare.com/profile/turnstile → create sitekey/secret

# Optional: idempotency for PayPal webhooks (D-MAP-5)
[[kv_namespaces]]
binding = "DONATE_EVENTS"
id = "66478f1b65ee4dc590d80f880604d43f"
