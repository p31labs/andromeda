# p31-passkey — Cloudflare Worker
# KV namespace:  93eea17dd472416dac5d74a8d379cc7e (CHALLENGES)
# D1 database:   56a448d7-f05f-40f8-a801-c299b7197a1d (p31-passkey-db)

name       = "p31-passkey"
main       = "src/index.ts"
compatibility_date = "2025-01-01"

# ── Top-level (local dev / default env) ─────────────────────────────────────
[vars]
RP_NAME = "P31 Labs"
RP_ID   = "localhost"

[[kv_namespaces]]
binding = "CHALLENGES"
id      = "93eea17dd472416dac5d74a8d379cc7e"

[[d1_databases]]
binding       = "DB"
database_name = "p31-passkey-db"
database_id   = "56a448d7-f05f-40f8-a801-c299b7197a1d"

# ── Production ───────────────────────────────────────────────────────────────
[env.production.vars]
RP_NAME = "P31 Labs"
RP_ID   = "p31ca.org"

[[env.production.kv_namespaces]]
binding = "CHALLENGES"
id      = "93eea17dd472416dac5d74a8d379cc7e"

[[env.production.d1_databases]]
binding       = "DB"
database_name = "p31-passkey-db"
database_id   = "56a448d7-f05f-40f8-a801-c299b7197a1d"

[[env.production.routes]]
pattern   = "p31ca.org/api/passkey/*"
zone_name = "p31ca.org"

[[env.production.routes]]
pattern   = "p31ca.org/api/education/*"
zone_name = "p31ca.org"

[[env.production.routes]]
pattern   = "p31ca.org/api/hardware/*"
zone_name = "p31ca.org"

# ── Preview ──────────────────────────────────────────────────────────────────
[env.preview.vars]
RP_NAME = "P31 Labs"
RP_ID   = "p31ca.pages.dev"

[[env.preview.kv_namespaces]]
binding = "CHALLENGES"
id      = "93eea17dd472416dac5d74a8d379cc7e"

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "p31-passkey-db"
database_id   = "56a448d7-f05f-40f8-a801-c299b7197a1d"

# Preview / workers.dev: Worker fetch handler still matches /api/education/* at the script URL.
# Production zone routes above also mount education progress on p31-passkey.

[[rules]]
type  = "ESModule"
globs = ["**/*.ts"]
