name = "p31-sync"
main = "index.ts"
compatibility_date = "2024-05-05"

# Durable Object for real-time sync per namespace
[[durable_objects.bindings]]
name = "SYNC_STATE"
class_name = "SyncState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncState"]

[[r2_buckets]]
bucket_name = "p31-mesh-bucket"
binding = "P31_MESH_BUCKET"

# Environment variables (set via wrangler secret)
# P31_SYNC_SECRET - HMAC secret for request validation
